server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Large static datasets (release_particles.json ~10MB)
    client_max_body_size 32m;

    # Proxy API calls to the FastAPI service. The frontend fetches
    # relative `/api/...` paths (see SearchBar.jsx, discogsApi.js).
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Service worker MUST NOT be long-cached, or SW updates (and the precache
    # they carry) never reach clients. A stale immutable sw.js on the origin +
    # CDN was the root of the "black world on soft-reload" bug: browsers kept
    # an old SW serving a frozen world.json. Always revalidate sw.js.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
